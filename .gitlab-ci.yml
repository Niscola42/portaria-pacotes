image: node:24-bookworm-slim

stages:
  - verify
  - test

default:
  before_script:
    - npm ci

typecheck:
  stage: verify
  script:
    - npm run typecheck

cucumber_test:
  stage: test
  needs:
    - typecheck
  script:
    - npm run test:ci
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: test-results.xml
