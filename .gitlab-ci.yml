image: node:24-bookworm-slim

stages:
  - verify
  - test
  - quality

default:
  before_script:
    - npm ci

typecheck:
  stage: verify
  script:
    - npm run typecheck

cucumber_test:
  stage: test
  needs:
    - typecheck
  script:
    - npm run test:ci
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: test-results.xml

static_analysis:
  stage: quality
  needs:
    - cucumber_test
  script:
    - npm run lint

coverage:
  stage: quality
  needs:
    - cucumber_test
  script:
    - npm run test:coverage
  coverage: '/All files\s+\|\s+([\d.]+)/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
